# Optional capability profile for NVIDIA Jetson NVMM pipelines.
#
# The same profile is usable on Jetson AGX Orin and Jetson Thor when their
# container exposes these exact GStreamer factories and properties. The
# runtime never detects a board model. It fails before opening its control
# socket if gst-inspect cannot prove the configured capability surface.
image_rtp_adapter:
  ros__parameters:
    encoder_backend: gstreamer
    gstreamer_jpeg_parser: jpegparse
    gstreamer_jpeg_caps: image/jpeg,framerate=@fps_fraction
    gstreamer_jpeg_decoder: nvjpegdec
    gstreamer_video_converter: nvvidconv
    # nvvidconv scales/uploads either decoded JPEG or packed ROS Image input.
    gstreamer_video_scaler: identity
    gstreamer_raw_caps: >-
      video/x-raw(memory:NVMM),format=NV12,width=@width,height=@height,framerate=@fps_fraction
    gstreamer_h264_encoder: nvv4l2h264enc
    gstreamer_decoder_properties_json: "{}"
    gstreamer_converter_properties_json: "{}"
    gstreamer_encoder_properties_json: >-
      {"control-rate":1,"bitrate":"@bitrate","iframeinterval":"@gop","idrinterval":"@gop","insert-sps-pps":true}
