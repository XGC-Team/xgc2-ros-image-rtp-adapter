# ROS 1 parameter-file form of the shared Jetson NVMM capability profile.
# It applies to Orin or Thor only when gst-inspect proves every configured
# factory and property inside the Agent container.
encoder_backend: gstreamer
gstreamer_jpeg_parser: jpegparse
gstreamer_jpeg_caps: image/jpeg,framerate=@fps_fraction
gstreamer_jpeg_decoder: nvjpegdec
gstreamer_video_converter: nvvidconv
gstreamer_video_scaler: identity
gstreamer_raw_caps: video/x-raw(memory:NVMM),format=NV12,width=@width,height=@height,framerate=@fps_fraction
gstreamer_h264_encoder: nvv4l2h264enc
gstreamer_decoder_properties_json: "{}"
gstreamer_converter_properties_json: "{}"
gstreamer_encoder_properties_json: '{"control-rate":1,"bitrate":"@bitrate","iframeinterval":"@gop","idrinterval":"@gop","insert-sps-pps":true}'
