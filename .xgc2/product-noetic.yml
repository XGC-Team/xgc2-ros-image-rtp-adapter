schema: xgc2.product.v1
id: xgc2-ros-noetic-ros-image-rtp-adapter
name: XGC2 ROS Image RTP Adapter for ROS Noetic
version: 0.3.0
kind: ros1-apt
summary: >-
  Parameterized ROS 1 Image or CompressedImage to H264/RTP adapter
  (Noetic/Focal) for xgc2-media-edge.
groups:
- ros1
- driver
- media
ros:
  distro: noetic
  packages:
  - ros_image_rtp_adapter
apt:
  distribution: focal
  install:
  - ros-noetic-xgc2-ros-image-rtp-adapter
  packages:
  - ros-noetic-xgc2-ros-image-rtp-adapter
  package_architectures:
    ros-noetic-xgc2-ros-image-rtp-adapter:
    - amd64
    - arm64
  depends:
  - ros-noetic-rospy
  - ros-noetic-sensor-msgs
  - ffmpeg
  - gstreamer1.0-tools
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-plugins-ugly
  - python3-pil
  recommends:
  - xgc2-media-edge
usage:
  install: |
    sudo apt update
    sudo apt install ros-noetic-xgc2-ros-image-rtp-adapter
  smoke_test: |
    source /opt/ros/noetic/setup.bash
    rospack find ros_image_rtp_adapter
    test -x /opt/ros/noetic/lib/ros_image_rtp_adapter/image_rtp_adapter
ownership:
  paths:
  - /opt/ros/noetic/lib/ros_image_rtp_adapter
  - /opt/ros/noetic/share/ros_image_rtp_adapter
  - /opt/ros/noetic/lib/python3/dist-packages/ros_image_rtp_adapter
release:
  repository: lxk36/xgc2-ros-image-rtp-adapter
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  requires:
  - xgc2-media-edge
  dependency_policy:
    xgc2-media-edge: order
  apt_versions:
    focal: 0.3.0
