schema: xgc2.product.v1
id: xgc2-ros-image-rtp-adapter
name: XGC2 ROS Image RTP Adapter
version: 0.4.0
kind: mixed
summary: >-
  Parameterized ROS 1/ROS 2 Image or CompressedImage to H264/RTP adapter
  implementing the xgc2-media-edge source control contract. Topics, message
  types, image formats, and FFmpeg/GStreamer capabilities are deployment data.
  Ships Noetic/Focal, Humble/Jammy, and Jazzy/Noble packages.
groups:
- ros1
- ros2
- driver
- media
apt:
  distribution: focal,jammy,noble
  install:
  - ros-noetic-xgc2-ros-image-rtp-adapter
  - ros-jazzy-xgc2-ros-image-rtp-adapter
  - ros-humble-xgc2-ros-image-rtp-adapter
  packages:
  - ros-noetic-xgc2-ros-image-rtp-adapter
  - ros-jazzy-xgc2-ros-image-rtp-adapter
  - ros-humble-xgc2-ros-image-rtp-adapter
  package_architectures:
    ros-noetic-xgc2-ros-image-rtp-adapter:
    - amd64
    - arm64
    ros-jazzy-xgc2-ros-image-rtp-adapter:
    - amd64
    - arm64
    ros-humble-xgc2-ros-image-rtp-adapter:
    - amd64
    - arm64
  package_distributions:
    ros-noetic-xgc2-ros-image-rtp-adapter:
    - focal
    ros-jazzy-xgc2-ros-image-rtp-adapter:
    - noble
    ros-humble-xgc2-ros-image-rtp-adapter:
    - jammy
  depends:
  - ffmpeg
  - libavcodec-extra
  - gstreamer1.0-tools
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-plugins-ugly
  - python3-numpy
  - python3-pil
  - ros-noetic-rospy
  - ros-noetic-sensor-msgs
  - ros-humble-rclpy
  - ros-humble-sensor-msgs
  - ros-humble-std-msgs
  - ros-humble-launch
  - ros-humble-launch-ros
  - ros-jazzy-rclpy
  - ros-jazzy-sensor-msgs
  - ros-jazzy-std-msgs
  - ros-jazzy-launch
  - ros-jazzy-launch-ros
  # Soft co-install with the Edge data plane. The adapter is a pure RTP source
  # and does not hard-Depends on media-edge at package install time.
  recommends:
  - xgc2-media-edge
usage:
  install: |
    # Jetson Thor / Ubuntu 24.04 + Jazzy
    sudo apt update
    sudo apt install ros-jazzy-xgc2-ros-image-rtp-adapter
    # ROS 1 Noetic / Ubuntu 20.04
    # sudo apt install ros-noetic-xgc2-ros-image-rtp-adapter
    # Ubuntu 22.04 + Humble
    # sudo apt install ros-humble-xgc2-ros-image-rtp-adapter
  smoke_test: |
    ros2 pkg prefix ros_image_rtp_adapter
    test -x "$(ros2 pkg prefix ros_image_rtp_adapter)/lib/ros_image_rtp_adapter/image_rtp_adapter"
ownership:
  paths:
  - /opt/ros/noetic/lib/ros_image_rtp_adapter
  - /opt/ros/noetic/share/ros_image_rtp_adapter
  - /opt/ros/noetic/lib/python3/dist-packages/ros_image_rtp_adapter
  - /opt/ros/noetic/lib/pkgconfig/ros_image_rtp_adapter.pc
  - /opt/ros/humble/lib/ros_image_rtp_adapter
  - /opt/ros/humble/share/ros_image_rtp_adapter
  - /opt/ros/humble/lib/python3.10/site-packages/ros_image_rtp_adapter
  - /opt/ros/humble/lib/python3.10/site-packages/ros_image_rtp_adapter-0.4.0-py3.10.egg-info
  - /opt/ros/humble/share/ament_index/resource_index/packages/ros_image_rtp_adapter
  - /opt/ros/humble/share/colcon-core/packages/ros_image_rtp_adapter
  - /opt/ros/jazzy/lib/ros_image_rtp_adapter
  - /opt/ros/jazzy/share/ros_image_rtp_adapter
  - /opt/ros/jazzy/lib/python3.12/site-packages/ros_image_rtp_adapter
  - /opt/ros/jazzy/lib/python3.12/site-packages/ros_image_rtp_adapter-0.4.0-py3.12.egg-info
  - /opt/ros/jazzy/share/ament_index/resource_index/packages/ros_image_rtp_adapter
  - /opt/ros/jazzy/share/colcon-core/packages/ros_image_rtp_adapter
  - /usr/share/doc/ros-noetic-xgc2-ros-image-rtp-adapter
  - /usr/share/doc/ros-humble-xgc2-ros-image-rtp-adapter
  - /usr/share/doc/ros-jazzy-xgc2-ros-image-rtp-adapter
release:
  repository: lxk36/xgc2-ros-image-rtp-adapter
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  # Push CI uses the exact Media Edge source in integration-lock.json. Release
  # train compatibility runs install the candidate from the signed staging APT
  # repository and exercise that installed package end to end.
  requires:
  - xgc2-media-edge
  dependency_policy:
    xgc2-media-edge: verify
  apt_versions:
    focal: 0.4.0
    jammy: 0.4.0
    noble: 0.4.0
