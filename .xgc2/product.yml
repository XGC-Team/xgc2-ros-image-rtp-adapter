schema: xgc2.product.v1
id: xgc2-ros-image-rtp-adapter
name: XGC2 ROS Image RTP Adapter
version: 0.1.1
kind: ros2-apt
summary: >-
  Parameterized ROS 2 CompressedImage (JPEG) to H264/RTP adapter implementing
  the xgc2-media-edge source control contract. Topic names and source IDs are
  launch parameters. Ships ROS Jazzy (noble) and ROS Humble (jammy) packages.
groups:
- ros2
- driver
- media
ros:
  distro: jazzy
  packages:
  - ros_image_rtp_adapter
apt:
  distribution: jammy,noble
  install:
  - ros-jazzy-xgc2-ros-image-rtp-adapter
  - ros-humble-xgc2-ros-image-rtp-adapter
  packages:
  - ros-jazzy-xgc2-ros-image-rtp-adapter
  - ros-humble-xgc2-ros-image-rtp-adapter
  package_architectures:
    ros-jazzy-xgc2-ros-image-rtp-adapter:
    - amd64
    - arm64
    ros-humble-xgc2-ros-image-rtp-adapter:
    - amd64
    - arm64
  package_distributions:
    ros-jazzy-xgc2-ros-image-rtp-adapter:
    - noble
    ros-humble-xgc2-ros-image-rtp-adapter:
    - jammy
  depends:
  - ffmpeg
  - python3-numpy
  - python3-pil
  # Soft co-install with the Edge data plane. The adapter is a pure RTP source
  # and does not hard-Depends on media-edge at package install time.
  recommends:
  - xgc2-media-edge
usage:
  install: |
    # Thor / Ubuntu 24.04 + Jazzy
    sudo apt update
    sudo apt install ros-jazzy-xgc2-ros-image-rtp-adapter
    # Ubuntu 22.04 + Humble
    # sudo apt install ros-humble-xgc2-ros-image-rtp-adapter
  smoke_test: |
    ros2 pkg prefix ros_image_rtp_adapter
    test -x "$(ros2 pkg prefix ros_image_rtp_adapter)/lib/ros_image_rtp_adapter/image_rtp_adapter"
ownership:
  paths:
  - /opt/ros/jazzy/lib/ros_image_rtp_adapter
  - /opt/ros/jazzy/share/ros_image_rtp_adapter
  - /opt/ros/jazzy/lib/python3.12/site-packages/ros_image_rtp_adapter
  - /opt/ros/humble/lib/ros_image_rtp_adapter
  - /opt/ros/humble/share/ros_image_rtp_adapter
release:
  repository: lxk36/xgc2-ros-image-rtp-adapter
  ref: jazzy
  workflow: release.yml
  ci_workflow: ci.yml
  # Integration scripts and CI clone/run xgc2-media-edge. Declare the product
  # edge so the release train can order media-edge before this adapter without
  # forcing a rebuild when Edge changes (contract is interface-stable).
  requires:
  - xgc2-media-edge
  dependency_policy:
    xgc2-media-edge: order
  apt_versions:
    jammy: 0.1.1
    noble: 0.1.1
