name: release

# Centralized XGC2 release-train contract. Products build trusted debs + manifests
# only; APT publish is owned by xgc2-devops orchestrator (never publish_apt here).

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: false
        default: release
        type: choice
        options:
          - release
          - compatibility-verify
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: false
        default: ""
        type: string
      run_cpp_quality:
        description: Compatibility input; this product has no C++ source
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run package unit tests during release
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  prepare-contract:
    name: Validate prepare contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-train inputs
        env:
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          case "${PREPARE_ACTION}" in
            release|compatibility-verify) ;;
            *)
              echo "unsupported prepare_action: ${PREPARE_ACTION}" >&2
              exit 1
              ;;
          esac
          if [[ -n "${DEPENDENCY_SET_DIGEST}" &&
                ! "${DEPENDENCY_SET_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "dependency_set_digest must be empty or 64 lowercase hex characters" >&2
            exit 1
          fi
          if [[ -n "${APT_OVERLAY_URL}" && -z "${DEPENDENCY_SET_DIGEST}" ]]; then
            echo "apt_overlay_url requires a dependency_set_digest" >&2
            exit 1
          fi

  validate-release-inputs:
    needs: prepare-contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.product.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected version and source SHA
        id: product
        run: |
          set -euo pipefail
          version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          test "${version}" = "${{ inputs.expected_version }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_source_sha }}"

  release-checks:
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run release checks
        run: |
          set -euo pipefail
          chmod +x .xgc2/scripts/*.sh scripts/*.sh scripts/*.py || true
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    if: ${{ inputs.run_cpp_quality }}
    needs: release-checks
    runs-on: ubuntu-latest
    steps:
      - name: Confirm C++ gate is not applicable
        run: echo "ros_image_rtp_adapter has no C++ source."

  source-tests:
    if: ${{ inputs.run_source_tests }}
    needs: release-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (control socket)
        run: |
          set -euo pipefail
          python3 -m pip install --user pytest
          PYTHONPATH=. python3 -m pytest test/test_control_socket.py -q

  # Matrix: Ubuntu 22.04/24.04 × amd64/arm64  →  humble/jazzy debs
  build-debs:
    needs:
      - validate-release-inputs
      - release-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: jazzy
            ubuntu: noble
            distribution: noble
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: jazzy
            ubuntu: noble
            distribution: noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - ros_distro: humble
            ubuntu: jammy
            distribution: jammy
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: humble
            ubuntu: jammy
            distribution: jammy
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build install-check debs (+ media-edge integration)
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x .xgc2/scripts/*.sh scripts/*.sh scripts/*.py || true
          host_arch="$(dpkg --print-architecture)"
          test "${host_arch}" = "${EXPECTED_ARCH}"
          # Release builds still run media-edge integration so bad RTP contracts
          # cannot enter the train.
          .xgc2/scripts/build_debs_in_docker.sh \
            --ros-distro "${{ matrix.ros_distro }}" \
            --ubuntu "${{ matrix.ubuntu }}" \
            --work-dir "$RUNNER_TEMP/rel-${{ matrix.ros_distro }}-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Create release-train build manifest
        run: |
          set -euo pipefail
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-ros-image-rtp-adapter \
            --product-version "${{ inputs.expected_version }}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"

      - name: Upload trusted deb artifacts
        if: ${{ inputs.prepare_action == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          # Train recovers debs by product + distribution + architecture.
          name: xgc2-ros-image-rtp-adapter-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
