name: release

# Centralized XGC2 release-train contract. Products only build trusted debs and
# manifests. APT repository promotion is owned by xgc2-devops orchestrator.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      prepare_action:
        description: Release-train action
        required: true
        type: choice
        options:
          - release
          - compatibility-verify
      apt_overlay_url:
        description: Optional release-scoped staging APT base URL
        required: false
        default: ""
        type: string
      dependency_set_digest:
        description: SHA256 of the resolved release-train dependency set
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  XGC2_APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
  XGC2_DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}

jobs:
  prepare-contract:
    name: Validate prepare contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-train inputs
        env:
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          case "${PREPARE_ACTION}" in
            release|compatibility-verify) ;;
            *)
              echo "unsupported prepare_action: ${PREPARE_ACTION}" >&2
              exit 1
              ;;
          esac
          if [[ ! "${DEPENDENCY_SET_DIGEST}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "dependency_set_digest must be 64 lowercase hex characters" >&2
            exit 1
          fi
          https_url_pattern='^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~%+:/=-]*)?$'
          if [[ -n "${APT_OVERLAY_URL}" &&
                ( "${APT_OVERLAY_URL}" =~ [[:space:][:cntrl:]] ||
                  ! "${APT_OVERLAY_URL}" =~ ${https_url_pattern} ) ]]; then
            echo "apt_overlay_url must be a trusted HTTPS URL" >&2
            exit 1
          fi
          if [[ "${PREPARE_ACTION}" == compatibility-verify && -z "${APT_OVERLAY_URL}" ]]; then
            echo "compatibility-verify requires apt_overlay_url" >&2
            exit 1
          fi

  validate-release-inputs:
    needs: prepare-contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.product.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate expected version and source SHA
        id: product
        run: |
          set -euo pipefail
          version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          test -n "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          test "${version}" = "${{ inputs.expected_version }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_source_sha }}"

  compliance:
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - name: Run release checks
        run: |
          set -euo pipefail
          chmod +x .xgc2/scripts/*.sh scripts/*.sh scripts/*.py
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  # Matrix: Ubuntu 20.04/22.04/24.04 x amd64/arm64 -> noetic/humble/jazzy debs
  build-debs:
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: noetic
            ubuntu: focal
            distribution: focal
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: noetic
            ubuntu: focal
            distribution: focal
            arch: arm64
            runner: ubuntu-24.04-arm
          - ros_distro: jazzy
            ubuntu: noble
            distribution: noble
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: jazzy
            ubuntu: noble
            distribution: noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - ros_distro: humble
            ubuntu: jammy
            distribution: jammy
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: humble
            ubuntu: jammy
            distribution: jammy
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build install-check debs (+ media-edge integration)
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          PREPARE_ACTION: ${{ inputs.prepare_action }}
          APT_OVERLAY_URL: ${{ inputs.apt_overlay_url }}
          DEPENDENCY_SET_DIGEST: ${{ inputs.dependency_set_digest }}
        run: |
          set -euo pipefail
          chmod +x .xgc2/scripts/*.sh scripts/*.sh scripts/*.py
          host_arch="$(dpkg --print-architecture)"
          test "${host_arch}" = "${EXPECTED_ARCH}"
          dependency_mode=locked-source
          dependency_args=()
          if [[ -n "${APT_OVERLAY_URL}" ]]; then
            dependency_mode=staging-apt
            dependency_args+=(--apt-overlay-url "${APT_OVERLAY_URL}")
          fi
          echo "XGC2_RELEASE_DEPENDENCY_MODE=${dependency_mode}" >> "$GITHUB_ENV"
          .xgc2/scripts/build_debs_in_docker.sh \
            --ros-distro "${{ matrix.ros_distro }}" \
            --ubuntu "${{ matrix.ubuntu }}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --prepare-action "${PREPARE_ACTION}" \
            --dependency-mode "${dependency_mode}" \
            --dependency-set-digest "${DEPENDENCY_SET_DIGEST}" \
            "${dependency_args[@]}"

      - name: Create release-train build manifest
        run: |
          set -euo pipefail
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-ros-image-rtp-adapter \
            --product-version "${{ inputs.expected_version }}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --prepare-action "${{ inputs.prepare_action }}" \
            --dependency-mode "$XGC2_RELEASE_DEPENDENCY_MODE" \
            --dependency-set-digest "${{ inputs.dependency_set_digest }}" \
            --dependency-evidence debs/xgc2-dependency-evidence.json
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir . \
            --deb-output-dir .ci/verified-debs \
            --manifest-output-dir .ci/verified-manifests \
            --product xgc2-ros-image-rtp-adapter \
            --product-version "${{ inputs.expected_version }}" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "${{ inputs.expected_source_sha }}" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --prepare-action "${{ inputs.prepare_action }}" \
            --dependency-mode "$XGC2_RELEASE_DEPENDENCY_MODE" \
            --dependency-set-digest "${{ inputs.dependency_set_digest }}" \
            --dependency-evidence debs/xgc2-dependency-evidence.json

      - name: Upload trusted deb artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Train recovers debs by product + distribution + architecture.
          name: xgc2-ros-image-rtp-adapter-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
