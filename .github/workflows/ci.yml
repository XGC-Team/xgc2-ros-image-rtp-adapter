name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xgc2-ros-image-rtp-adapter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Pure quality gates run in parallel with matrix builds (release-train contract).
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - name: Compliance
        run: |
          set -euo pipefail
          chmod +x .xgc2/scripts/*.sh scripts/*.sh scripts/*.py
          git diff --check HEAD
          .xgc2/scripts/check_package_compliance.sh

  matrix:
    name: ${{ matrix.ros_distro }}-${{ matrix.ubuntu }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: noetic
            ubuntu: focal
            distribution: focal
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: noetic
            ubuntu: focal
            distribution: focal
            arch: arm64
            runner: ubuntu-24.04-arm
          - ros_distro: jazzy
            ubuntu: noble
            distribution: noble
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: jazzy
            ubuntu: noble
            distribution: noble
            arch: arm64
            runner: ubuntu-24.04-arm
          - ros_distro: humble
            ubuntu: jammy
            distribution: jammy
            arch: amd64
            runner: ubuntu-24.04
          - ros_distro: humble
            ubuntu: jammy
            distribution: jammy
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build deb + install-check + media-edge integration
        env:
          ROS_DISTRO: ${{ matrix.ros_distro }}
          UBUNTU_CODENAME: ${{ matrix.ubuntu }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          chmod +x .xgc2/scripts/*.sh scripts/*.sh scripts/*.py
          host_arch="$(dpkg --print-architecture)"
          test "${host_arch}" = "${EXPECTED_ARCH}"
          dependency_set_digest="$(python3 .xgc2/scripts/read_integration_lock.py \
            --lock .xgc2/integration-lock.json --field dependencySetDigest)"
          .xgc2/scripts/build_debs_in_docker.sh \
            --ros-distro "${ROS_DISTRO}" \
            --ubuntu "${UBUNTU_CODENAME}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --prepare-action ci \
            --dependency-mode locked-source \
            --dependency-set-digest "${dependency_set_digest}"

      - name: Create trusted build manifest
        run: |
          set -euo pipefail
          product_version="$(awk -F': *' '/^version:[[:space:]]*/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs \
            --output-dir .ci/build-manifests \
            --product xgc2-ros-image-rtp-adapter \
            --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" \
            --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py verify-build \
            --artifact-dir . \
            --deb-output-dir .ci/verified-debs \
            --manifest-output-dir .ci/verified-manifests \
            --product xgc2-ros-image-rtp-adapter \
            --product-version "$product_version" \
            --distribution "${{ matrix.distribution }}" \
            --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" \
            --ci-run-id "$GITHUB_RUN_ID"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xgc2-ros-image-rtp-adapter-${{ matrix.distribution }}-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          retention-days: 14
          include-hidden-files: true
